
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART CONTROL | ESP32</title>

<style>
:root {
  --bg: #07111f;
  --panel: #101f33;
  --border: #233750;
  --text: #eaf4ff;
  --muted: #8da4bf;
  --green: #27f5a0;
  --red: #ff5573;
  --blue: #42baff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #153052 0%, transparent 55%),
    var(--bg);
  font-family: "Segoe UI", Arial, sans-serif;
}

.dashboard {
  width: 100%;
  max-width: 480px;
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  background: rgba(12, 27, 45, .96);
  box-shadow: 0 25px 80px #0008;
}

.header {
  padding: 25px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(120deg, #142d49, #0c1b2d);
}

.brand {
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
}

h1 {
  margin: 10px 0 6px;
  font-size: 27px;
  letter-spacing: -.5px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.connection {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 20px;
  font-size: 12px;
  color: var(--muted);
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #8290a1;
}

.dot.good {
  background: var(--green);
  box-shadow: 0 0 12px var(--green);
}

.dot.bad { background: var(--red); }

.content { padding: 24px; }

.section-title {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.lamp-box {
  margin: 18px 0;
  padding: 26px 15px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: linear-gradient(160deg, #142940, #0b1828);
}

.lamp {
  width: 108px;
  height: 108px;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #8ba0b7;
  background: #1b2a3d;
  border: 5px solid #2b4059;
  box-shadow: inset 0 0 20px #0005;
  transition: .3s ease;
}

.lamp svg {
  width: 47px;
  height: 47px;
}

.lamp.on {
  color: #fff2a8;
  background: #8e6912;
  border-color: #ffda54;
  box-shadow: 0 0 22px #ffca3a88,
              0 0 55px #ffca3a33,
              inset 0 0 18px #fff3;
}

.state {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 2px;
}

.state.on { color: var(--green); }

.description {
  margin-top: 7px;
  font-size: 12px;
  color: var(--muted);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

button {
  min-height: 58px;
  border: 1px solid transparent;
  border-radius: 13px;
  color: white;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .2s;
}

button:active { transform: scale(.97); }

button:disabled {
  opacity: .45;
  cursor: wait;
}

.start {
  background: linear-gradient(135deg, #0eaa70, #20e69a);
  box-shadow: 0 5px 20px #20e69a22;
}

.stop {
  background: linear-gradient(135deg, #d93351, #ff5975);
  box-shadow: 0 5px 20px #ff597522;
}

.start:hover, .stop:hover { filter: brightness(1.12); }

.message {
  margin-top: 18px;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #091625;
  color: #b7c8da;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.message::before {
  content: "● ";
  color: var(--blue);
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}

.info {
  padding: 15px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #0b1929;
}

.info small {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
}

.info strong { font-size: 14px; }

.footer {
  padding: 16px;
  text-align: center;
  border-top: 1px solid var(--border);
  color: #627a95;
  font-size: 10px;
  letter-spacing: 1px;
}

@media (max-width: 360px) {
  .content { padding: 16px; }
  h1 { font-size: 23px; }
  .lamp { width: 90px; height: 90px; }
}
</style>
</head>

<body>
<main class="dashboard">

  <header class="header">
    <div class="brand">INDUSTRIAL AUTOMATION</div>
    <h1>Smart Lamp Control</h1>
    <div class="subtitle">ESP32 Remote Control System</div>

    <div class="connection">
      <span class="dot" id="connectionDot"></span>
      <span id="connectionText">MENUNGGU PERINTAH</span>
    </div>
  </header>

  <section class="content">
    <div class="section-title">Monitoring perangkat</div>

    <div class="lamp-box">
      <div class="lamp" id="lamp">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"/>
          <path d="M10 22h4"/>
          <path d="M8.5 14.5a7 7 0 1 1 7 0c-.8.6-1.2 1.5-1.2 2.5h-4.6c0-1-.4-1.9-1.2-2.5Z"/>
        </svg>
      </div>

      <div class="state" id="lampState">STANDBY</div>
      <div class="description">Output LED · GPIO25</div>
    </div>

    <div class="section-title">Panel kontrol</div>

    <div class="controls">
      <button class="start" id="startBtn"
        onclick="kirimPerintah(1)">▶ START</button>

      <button class="stop" id="stopBtn"
        onclick="kirimPerintah(0)">■ STOP</button>
    </div>

    <div class="message" id="status" role="status" aria-live="polite">
      Sistem siap menerima perintah.
    </div>

    <div class="info-grid">
      <div class="info">
        <small>MIKROKONTROLER</small>
        <strong>ESP32</strong>
      </div>
      <div class="info">
        <small>MODE KONTROL</small>
        <strong>Internet</strong>
      </div>
    </div>
  </section>

  <footer class="footer">
    SMART CONTROL SYSTEM · ESP32
  </footer>
</main>

<script>
const API =
  "https://kontrolled.mikrokontroller758.workers.dev";

// Masukkan nilai Secret CONTROL_PIN milikmu.
const PIN = "habiburahmanfaris";

const lamp = document.getElementById("lamp");
const lampState = document.getElementById("lampState");
const statusBox = document.getElementById("status");
const connectionDot = document.getElementById("connectionDot");
const connectionText = document.getElementById("connectionText");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");

let sedangMengirim = false;

function aturIndikator(nyala) {
  lamp.classList.toggle("on", nyala);
  lampState.classList.toggle("on", nyala);
  lampState.textContent = nyala ? "LAMP ON" : "LAMP OFF";
}

function aturKoneksi(terhubung) {
  connectionDot.classList.toggle("good", terhubung);
  connectionDot.classList.toggle("bad", !terhubung);
  connectionText.textContent = terhubung
    ? "SERVER MERESPONS"
    : "PERMINTAAN GAGAL";
}

async function kirimPerintah(nilai) {
  if (sedangMengirim) return;

  sedangMengirim = true;
  startBtn.disabled = true;
  stopBtn.disabled = true;
  statusBox.textContent = "Mengirim perintah ke server...";

  try {
    const response = await fetch(API + "/api/command", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Control-Pin": PIN
      },
      body: JSON.stringify({ led: nilai })
    });

    const hasil = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(hasil.error || "HTTP " + response.status);
    }

    aturKoneksi(true);
    aturIndikator(nilai === 1);
    statusBox.textContent = nilai === 1
      ? "Perintah START berhasil diterima server."
      : "Perintah STOP berhasil diterima server.";

  } catch (error) {
    console.error("Kontrol lampu:", error);
    aturKoneksi(false);
    statusBox.textContent =
      "Gagal: " + (error.message || "Periksa koneksi server.");
  } finally {
    sedangMengirim = false;
    startBtn.disabled = false;
    stopBtn.disabled = false;
  }
}
</script>
</body>
</html>
