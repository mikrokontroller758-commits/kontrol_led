```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrol LED ESP32</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: #eaf2ff;
      background:
        radial-gradient(circle at top, #183452 0, transparent 45%),
        #08111f;
    }

    .panel {
      width: 100%;
      max-width: 430px;
      padding: 28px 24px;
      border: 1px solid #29425e;
      border-radius: 22px;
      background: rgba(14, 27, 45, 0.96);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .label {
      color: #38bdf8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: 27px;
    }

    .description {
      margin: 0 0 25px;
      color: #9fb2c9;
      font-size: 14px;
      line-height: 1.6;
    }

    .lamp-box {
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #263d56;
      border-radius: 16px;
      background: #0a1626;
    }

    .lamp {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #263548;
      border: 4px solid #40536a;
      box-shadow: inset 0 0 15px #101a28;
      transition: 0.25s;
    }

    .lamp.on {
      background: #22c55e;
      border-color: #86efac;
      box-shadow: 0 0 18px #22c55e, 0 0 38px #16a34a;
    }

    .lamp-text {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      color: #9fb2c9;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .start {
      background: linear-gradient(135deg, #16a34a, #22c55e);
    }

    .stop {
      background: linear-gradient(135deg, #dc2626, #ef4444);
    }

    .hint {
      margin: 18px 0 0;
      color: #8295ac;
      font-size: 12px;
      line-height: 1.6;
    }

    footer {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #29425e;
      color: #9fb2c9;
      font-size: 13px;
    }

    footer strong {
      display: block;
      margin-top: 6px;
      color: #38bdf8;
      font-size: 15px;
    }

    @media (max-width: 360px) {
      .panel {
        padding: 22px 16px;
      }

      h1 {
        font-size: 23px;
      }

      .buttons {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="label">ESP32 • IoT CONTROL</div>
    <h1>Kontrol Lampu</h1>
    <p class="description">
      Kendalikan lampu ESP32 dari website melalui internet.
    </p>

    <section class="lamp-box">
      <div id="lamp" class="lamp"></div>
      <div id="lampText" class="lamp-text">LAMPU MATI</div>
      <div id="status" class="status">Siap mengirim perintah</div>
    </section>

    <div class="buttons">
      <button id="startBtn" class="start" onclick="kirimPerintah(1)">
        ▶ START
      </button>

      <button id="stopBtn" class="stop" onclick="kirimPerintah(0)">
        ■ STOP
      </button>
    </div>

    <p class="hint">
      START untuk menyalakan lampu.<br>
      STOP untuk mematikan lampu.
    </p>

    <footer>
      Dibuat oleh
      <strong>Faris Habiburahman</strong>
    </footer>
  </main>

  <script>
    // URL Cloudflare Worker
    const API = "https://kontrolled.mikrokontroller758.workers.dev";

    // Ganti dengan nilai CONTROL_PIN milikmu di Cloudflare
    const PIN = "farishabiburahman";

    const lamp = document.getElementById("lamp");
    const lampText = document.getElementById("lampText");
    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function tampilkanLampu(nyala) {
      lamp.classList.toggle("on", nyala);
      lampText.textContent = nyala ? "LAMPU MENYALA" : "LAMPU MATI";
    }

    async function kirimPerintah(nilai) {
      startBtn.disabled = true;
      stopBtn.disabled = true;
      statusText.textContent = "Mengirim perintah...";

      try {
        const response = await fetch(API + "/api/command", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Control-Pin": PIN
          },
          body: JSON.stringify({ led: nilai })
        });

        if (!response.ok) {
          throw new Error("Server menolak perintah (" + response.status + ")");
        }

        tampilkanLampu(nilai === 1);
        statusText.textContent =
          nilai === 1
            ? "Perintah START berhasil dikirim"
            : "Perintah STOP berhasil dikirim";

      } catch (error) {
        statusText.textContent = "Gagal: " + error.message;
      } finally {
        startBtn.disabled = false;
        stopBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
